name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependency
        run: python -m pip install --upgrade pip setuptools wheel pytest && python -m pip install -e .
      - name: Run safety tests with resource warnings enabled
        run: python -W error::ResourceWarning -m pytest -q
      - name: Verify command interface
        run: provenance-inventory --help
      - name: Compile package
        run: python -m compileall -q provenance_inventory
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
